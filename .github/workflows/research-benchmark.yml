name: Recursive Research Benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node experiments/recursive-benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-research-report
          path: reports/latest.json
